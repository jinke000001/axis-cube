// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// On exFAT checkouts, macOS metadata files can confuse Android's resource
// parser. The project wrapper keeps generated build output on local APFS.
def axisBuildRoot = System.getenv('AXIS_ANDROID_BUILD_ROOT')
if (axisBuildRoot) {
    allprojects { project ->
        project.layout.buildDirectory.set(new File(axisBuildRoot, project.name))
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
